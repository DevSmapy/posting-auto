<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    :root {
      --bg: #0B1F3A;
      --fg: #F5F7FA;
      --muted: #A8B3C4;
      --accent: #F08A24;
      --light: #6EB6FF;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1080px;
      height: 1080px;
      font-family: "Pretendard", "Noto Sans KR", sans-serif;
      background:
        radial-gradient(ellipse at 18% 0%, rgba(110, 182, 255, 0.22) 0%, transparent 52%),
        radial-gradient(ellipse at 100% 100%, rgba(91, 75, 138, 0.35) 0%, transparent 48%),
        var(--bg);
      color: var(--fg);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 96px 88px;
    }
    .eyebrow {
      font-size: 26px;
      letter-spacing: 0.18em;
      color: var(--accent);
      font-weight: 700;
    }
    h1 {
      margin-top: 40px;
      font-size: 88px;
      line-height: 1.12;
      font-weight: 800;
      letter-spacing: -0.03em;
      max-width: 12ch;
    }
    .body {
      margin-top: 40px;
      font-size: 34px;
      line-height: 1.45;
      color: var(--muted);
      font-weight: 500;
      max-width: 22ch;
    }
    .footer {
      font-size: 24px;
      color: var(--light);
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <div>
    <p class="eyebrow">DAILY BRIEF</p>
    <h1>{{headline}}</h1>
    <p class="body">{{body}}</p>
  </div>
  <p class="footer">{{brand}}</p>
</body>
</html>
