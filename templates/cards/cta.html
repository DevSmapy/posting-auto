<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    :root {
      --bg: #0B1F3A;
      --fg: #F5F7FA;
      --muted: #A8B3C4;
      --accent: #F08A24;
      --green: #2F9E6A;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1080px;
      height: 1080px;
      font-family: "Pretendard", "Noto Sans KR", sans-serif;
      background:
        linear-gradient(155deg, #122846 0%, #0B1F3A 55%, #1a2a20 100%);
      color: var(--fg);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 96px 88px;
    }
    .label {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.14em;
      color: var(--green);
    }
    h1 {
      margin-top: 48px;
      font-size: 56px;
      line-height: 1.3;
      font-weight: 800;
      letter-spacing: -0.02em;
      max-width: 12ch;
      word-break: keep-all;
    }
    .body {
      margin-top: 36px;
      font-size: 32px;
      line-height: 1.5;
      color: var(--muted);
      font-weight: 500;
      max-width: 20ch;
      word-break: keep-all;
    }
    .footer {
      font-size: 22px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div>
    <p class="label">{{label}} · {{index}}</p>
    <h1>{{headline}}</h1>
    <p class="body">{{body}}</p>
  </div>
  <p class="footer">{{brand}}</p>
</body>
</html>
