<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    :root {
      --bg: #0B1F3A;
      --fg: #F5F7FA;
      --muted: #A8B3C4;
      --accent: #F08A24;
      --light: #6EB6FF;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1080px;
      height: 1080px;
      font-family: "Pretendard", "Noto Sans KR", sans-serif;
      background:
        radial-gradient(ellipse at 80% 0%, rgba(91, 75, 138, 0.45) 0%, transparent 50%),
        radial-gradient(ellipse at 0% 100%, rgba(110, 182, 255, 0.18) 0%, transparent 45%),
        var(--bg);
      color: var(--fg);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 96px 88px;
    }
    .label {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.14em;
      color: var(--accent);
      text-transform: uppercase;
    }
    .index {
      margin-left: 16px;
      color: var(--light);
      letter-spacing: 0.08em;
    }
    h1 {
      margin-top: 56px;
      font-size: 64px;
      line-height: 1.28;
      font-weight: 800;
      letter-spacing: -0.03em;
      max-width: 14ch;
      word-break: keep-all;
    }
    .body {
      margin-top: 40px;
      font-size: 34px;
      line-height: 1.45;
      color: var(--muted);
      font-weight: 500;
      max-width: 20ch;
      word-break: keep-all;
    }
    .footer {
      font-size: 22px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div>
    <p class="label">{{label}}<span class="index">{{index}}</span></p>
    <h1>{{headline}}</h1>
    <p class="body">{{body}}</p>
  </div>
  <p class="footer">{{brand}}</p>
</body>
</html>
