<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    :root {
      --bg: #0B1F3A;
      --fg: #F5F7FA;
      --muted: #A8B3C4;
      --accent: #F08A24;
      --line: rgba(245, 247, 250, 0.14);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1080px;
      height: 1080px;
      font-family: "Pretendard", "Noto Sans KR", sans-serif;
      background:
        radial-gradient(ellipse at 0% 100%, rgba(47, 158, 106, 0.12) 0%, transparent 40%),
        var(--bg);
      color: var(--fg);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 96px 88px;
    }
    .meta {
      display: flex;
      align-items: baseline;
      gap: 18px;
    }
    .label {
      font-size: 28px;
      color: var(--accent);
      font-weight: 700;
      letter-spacing: 0.06em;
    }
    .index {
      font-size: 26px;
      color: var(--muted);
      font-weight: 600;
      letter-spacing: 0.08em;
    }
    h1 {
      margin-top: 44px;
      font-size: 54px;
      line-height: 1.28;
      font-weight: 800;
      letter-spacing: -0.02em;
      max-width: 14ch;
      word-break: keep-all;
    }
    .divider {
      margin: 32px 0;
      height: 2px;
      background: var(--line);
      width: 96px;
    }
    .body {
      font-size: 34px;
      line-height: 1.5;
      color: var(--muted);
      font-weight: 500;
      max-width: 20ch;
      word-break: keep-all;
    }
    .footer {
      font-size: 22px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div>
    <div class="meta">
      <p class="label">{{label}}</p>
      <p class="index">{{index}}</p>
    </div>
    <h1>{{headline}}</h1>
    <div class="divider"></div>
    <p class="body">{{body}}</p>
  </div>
  <p class="footer">{{brand}}</p>
</body>
</html>
