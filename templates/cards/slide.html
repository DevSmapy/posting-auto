<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f1720;
      --fg: #f4f1ea;
      --muted: #9aa7b5;
      --accent: #d4a574;
      --line: rgba(244, 241, 234, 0.12);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1080px;
      height: 1080px;
      font-family: "Noto Sans KR", sans-serif;
      background:
        radial-gradient(ellipse at 0% 100%, #1a2430 0%, transparent 40%),
        var(--bg);
      color: var(--fg);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 96px 88px;
    }
    .index {
      font-size: 28px;
      color: var(--accent);
      font-weight: 700;
      letter-spacing: 0.12em;
    }
    h1 {
      margin-top: 48px;
      font-size: 58px;
      line-height: 1.28;
      font-weight: 900;
      letter-spacing: -0.02em;
      max-width: 14ch;
      word-break: keep-all;
    }
    .divider {
      margin: 36px 0;
      height: 2px;
      background: var(--line);
      width: 96px;
    }
    .body {
      font-size: 38px;
      line-height: 1.45;
      color: var(--muted);
      font-weight: 500;
      max-width: 18ch;
      word-break: keep-all;
    }
    .footer {
      font-size: 22px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div>
    <p class="index">{{index}}</p>
    <h1>{{headline}}</h1>
    <div class="divider"></div>
    <p class="body">{{body}}</p>
  </div>
  <p class="footer">{{brand}}</p>
</body>
</html>
