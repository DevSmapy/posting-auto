<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <style>{{DESIGN_SYSTEM_CSS}}
    .head { margin-top: 40px; margin-bottom: 36px; }
    .timeline {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 24px 28px;
      margin-bottom: 24px;
    }
    .tl-step {
      flex: 1;
      text-align: center;
      font-size: 20px;
      font-weight: 700;
      color: var(--color-primary);
    }
    .tl-arrow {
      color: var(--color-accent);
      font-size: 28px;
      font-weight: 700;
    }
    .scenarios {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }
    .scenario {
      padding: 28px;
      min-height: 280px;
    }
    .scenario .tag {
      display: inline-flex;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 16px;
    }
    .scenario.a .tag { background: #DBEAFE; color: var(--color-primary); }
    .scenario.b .tag { background: #FEF3C7; color: #92400E; }
    .scenario h3 {
      font-size: 30px;
      font-weight: 700;
      margin-bottom: 12px;
      word-break: keep-all;
    }
    .flow {
      padding: 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .flow-node {
      flex: 1;
      text-align: center;
      padding: 18px 12px;
      border-radius: 16px;
      background: var(--color-soft);
      font-size: 22px;
      font-weight: 700;
      color: var(--color-primary);
      word-break: keep-all;
    }
    .flow-arrow { color: var(--color-accent); font-size: 28px; font-weight: 700; }
    .expect {
      margin-top: 20px;
      padding: 24px 28px;
      display: flex;
      gap: 16px;
      align-items: flex-start;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="label"><span class="dot"></span> Future Outlook</div>
    <div class="head">
      <h1 class="h2">{{title}}</h1>
    </div>
    <div class="card timeline">
      <div class="tl-step">{{tl_1}}</div>
      <div class="tl-arrow">→</div>
      <div class="tl-step">{{tl_2}}</div>
      <div class="tl-arrow">→</div>
      <div class="tl-step">{{tl_3}}</div>
    </div>
    <div class="scenarios">
      <div class="card scenario a">
        <span class="tag">Scenario A</span>
        <h3>{{scenario_a_title}}</h3>
        <p class="body-sm">{{scenario_a_body}}</p>
      </div>
      <div class="card scenario b">
        <span class="tag">Scenario B</span>
        <h3>{{scenario_b_title}}</h3>
        <p class="body-sm">{{scenario_b_body}}</p>
      </div>
    </div>
    <div class="card flow">
      <div class="flow-node">{{flow_1}}</div>
      <div class="flow-arrow">→</div>
      <div class="flow-node">{{flow_2}}</div>
      <div class="flow-arrow">→</div>
      <div class="flow-node">{{flow_3}}</div>
    </div>
    <div class="card expect">
      <div class="icon-badge accent"><svg viewBox="0 0 24 24"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 1 4 12c-.8.7-1.3 1.5-1.5 2.5H9.5C9.3 15.5 8.8 14.7 8 14a7 7 0 0 1 4-12z"/></svg></div>
      <div>
        <div class="eyebrow">Expert expectation</div>
        <p class="body" style="margin-top:8px;color:var(--color-text);">{{expert_expectation}}</p>
      </div>
    </div>
    <div class="footer-meta">
      <span class="brand">{{brand}}</span>
      <span class="page">06 / 08</span>
    </div>
  </div>
</body>
</html>
