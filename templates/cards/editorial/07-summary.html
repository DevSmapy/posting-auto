<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <style>{{DESIGN_SYSTEM_CSS}}
    .quote-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 40px 8px;
    }
    .quote-mark {
      font-size: 120px;
      line-height: 0.8;
      font-weight: 700;
      color: var(--color-accent);
      opacity: 0.9;
      margin-bottom: 24px;
    }
    .quote-card {
      padding: 48px 40px;
      border-left: 6px solid var(--color-accent);
    }
    .quote-text {
      font-size: 52px;
      font-weight: 700;
      line-height: 1.35;
      letter-spacing: -0.02em;
      color: var(--color-text);
      word-break: keep-all;
    }
    .quote-note {
      margin-top: 28px;
      font-size: 24px;
      font-weight: 400;
      color: var(--color-text-secondary);
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="label"><span class="dot"></span> Summary</div>
    <div class="quote-wrap">
      <div class="quote-mark">“</div>
      <div class="card quote-card">
        <p class="quote-text">{{summary_quote}}</p>
        <p class="quote-note">{{summary_note}}</p>
      </div>
    </div>
    <div class="footer-meta">
      <span class="brand">{{brand}}</span>
      <span class="page">07 / 08</span>
    </div>
  </div>
</body>
</html>
